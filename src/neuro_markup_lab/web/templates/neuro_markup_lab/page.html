<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Разметка — NeuroMarkupLab</title>
  <link rel="stylesheet" href="static/neuro_markup_lab.css">
</head>
<body class="nml-body">
  {{ nav | safe }}
  <main class="nml-page" id="nml-page">
    {# Каталоги: видео (с подкаталогами) и боевые JSON. Значения помнит браузер. #}
    <section class="nml-panel nml-toolbar">
      <div class="nml-field">
        <label class="nml-label" for="nml-video-dir">Каталог видео</label>
        <div class="nml-row">
          <input type="text" id="nml-video-dir" class="nml-input" autocomplete="off"
                 placeholder="напр. D:\video\plant\line1">
          <button type="button" class="nml-btn" data-pick="nml-video-dir">Выбрать</button>
        </div>
        <label class="nml-check">
          <input type="checkbox" id="nml-recursive"> Искать видео в подкаталогах
        </label>
      </div>
      <div class="nml-field">
        <label class="nml-label" for="nml-jsons-dir">Каталог боевых JSON</label>
        <div class="nml-row">
          <input type="text" id="nml-jsons-dir" class="nml-input" autocomplete="off"
                 placeholder="напр. D:\markup\plant">
          <button type="button" class="nml-btn" data-pick="nml-jsons-dir">Выбрать</button>
        </div>
        <div class="nml-hint muted">Боевая подбирается по имени и пути видео; у видео можно выбрать файл вручную</div>
      </div>
      <div class="nml-field nml-field-filter">
        <label class="nml-label" for="nml-filter">Фильтр</label>
        <input type="search" id="nml-filter" class="nml-input" autocomplete="off" placeholder="имя видео">
      </div>
    </section>

    <div class="nml-status" id="nml-status"></div>
    <section class="nml-list" id="nml-list"></section>
  </main>

  <script src="static/neuro_markup_lab_shapes.js"></script>
  <script src="static/neuro_markup_lab_editor.js"></script>
  <script src="static/neuro_markup_lab_frame.js"></script>
  <script src="static/neuro_markup_lab_page.js"></script>
</body>
</html>
