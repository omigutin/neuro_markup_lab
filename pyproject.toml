[project]
name = "neuro-markup-lab"
version = "0.1.0"
description = "Редактор разметки зон по кадру видео: источники разметки, приведение типов, версии и веб-интерфейс."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "omigutin", email = "migutin83@yandex.ru" }]
requires-python = ">=3.10,<4.0"
keywords = ["markup", "labelme", "zones", "video", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
# OpenCV нужен только для кадра видео и не обязателен: в проекте-хозяине может уже стоять opencv-python,
# а одновременная установка с opencv-python-headless ломает cv2.
opencv = ["opencv-python>=4.8"]
headless = ["opencv-python-headless>=4.8"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1"]

[project.scripts]
nml = "neuro_markup_lab.cli.main:main"

[tool.poetry]
packages = [{ include = "neuro_markup_lab", from = "src" }]
include = [
    { path = "src/neuro_markup_lab/web/static/*", format = ["sdist", "wheel"] },
    { path = "src/neuro_markup_lab/web/templates/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.5"
mypy = ">=1.10"
httpx = ">=0.27"
opencv-python-headless = ">=4.8"
fastapi = ">=0.110"
uvicorn = ">=0.27"
jinja2 = ">=3.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
files = ["src/neuro_markup_lab"]
